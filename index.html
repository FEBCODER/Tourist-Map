<body>

<!-- MAP -->
<div id="map"></div>

<!-- SEARCH -->
<div class="search-panel">

        type="search"

</div>

<!-- FILTER -->
<div class="filter-panel">

            🏛️ Historical
        </option>

            🌿 Nature / Park
        </option>

        <option value="adventure">
            🎢 Adventure
        </option>

        <option value="beach">
            🏖️ Beach
        </option>

    </select>

</div>

<!-- RESULTS -->
<div class="results-panel">

    <!-- NEAREST -->
    <div class="nearest">

        <div class="nearest-title">

        </div>

        id="spotList"

<button
    id="locateBtn"

>
    📍
</button>

<!-- MAP CONTROLS -->
<div class="map-controls">

    <button
        class="map-control"
        onclick="map.zoomIn()"
    >
        +
    </button>

    <button
        class="map-control"
        onclick="map.zoomOut()"
    >
        −
    </button>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================
   TOURIST SPOTS
========================================================= */

const TOURIST_SPOTS = [

    {
        id: 1,
        name: "Intramuros",
        lat: 14.5896,
        lng: 120.9749,
        cat: "historical",
        desc: "Walled city from the Spanish colonial era."
    },

    {
        id: 2,
        name: "Rizal Park (Luneta)",
        lat: 14.5823,
        lng: 120.9747,
        cat: "historical",
        desc: "Historic park honoring Dr. José Rizal."
    },

    {
        id: 3,
        name: "Manila Ocean Park",
        lat: 14.5792,
        lng: 120.9717,
        cat: "nature",
        desc: "Oceanarium and marine-themed park."
    },

    {
        id: 4,
        name: "Fort Santiago",
        lat: 14.5948,
        lng: 120.9705,
        cat: "historical",
        desc: "Citadel built during the Spanish era."
    },

    {
        id: 5,
        name: "National Museum of Fine Arts",
        lat: 14.5869,
        lng: 120.9812,
        cat: "historical",
        desc: "Home of the famous Spoliarium painting."
    },

    {
        id: 6,
        name: "Star City",
        lat: 14.5686,
        lng: 120.9894,
        cat: "adventure",
        desc: "Popular amusement park by the bay."
    },

    {
        id: 7,
        name: "Manila Baywalk",
        lat: 14.5673,
        lng: 120.9803,
        cat: "nature",
        desc: "Famous sunset promenade along Roxas Boulevard."
    },

    {
        id: 8,
        name: "Binondo Chinatown",
        lat: 14.6004,
        lng: 120.9745,
        cat: "historical",
        desc: "Historic Chinatown district."
    },

    {
        id: 9,
        name: "Paco Park",
        lat: 14.5791,
        lng: 120.9892,
        cat: "nature",
        desc: "Circular Spanish-era cemetery turned park."
    },

    {
        id: 10,
        name: "Casa Manila",
        lat: 14.5899,
        lng: 120.9750,
        cat: "historical",
        desc: "Museum showcasing colonial lifestyle."
    }

];


/* =========================================================
   ICONS
========================================================= */

const CATEGORY_ICONS = {

    beach: "🏖️",

    nature: "🌿",

    historical: "🏛️",

    adventure: "🎢"

};


/* =========================================================
   VARIABLES
========================================================= */

let map;

let userMarker = null;

let routeLine = null;

let userPos = null;

const spotMarkers = {};


/* =========================================================
   HAVERSINE FORMULA
========================================================= */

function toRad(degrees) {

    return degrees * Math.PI / 180;

}


function haversineKm(
    lat1,
    lng1,
    lat2,
    lng2
) {

    const R = 6371;

    const dLat =
        toRad(lat2 - lat1);

    const dLng =
        toRad(lng2 - lng1);

    const a =
        Math.sin(dLat / 2) *
        Math.sin(dLat / 2)

        +

        Math.cos(toRad(lat1)) *
        Math.cos(toRad(lat2)) *

        Math.sin(dLng / 2) *
        Math.sin(dLng / 2);

    return 2 *
        R *
        Math.asin(
            Math.sqrt(a)
        );

}


/* =========================================================
   NEAREST NEIGHBOR
========================================================= */

function nearestNeighborRoute(
    start,
    spots
) {

    const unvisited = [...spots];

    const route = [];

    let current = start;

    let totalKm = 0;

    while (unvisited.length > 0) {

        let nearestIndex = 0;

        let nearestDistance = Infinity;

        for (
            let i = 0;
            i < unvisited.length;
            i++
        ) {

            const distance =
                haversineKm(
                    current.lat,
                    current.lng,
                    unvisited[i].lat,
                    unvisited[i].lng
                );

            if (
                distance <
                nearestDistance
            ) {

                nearestDistance =
                    distance;

                nearestIndex = i;

            }

        }

        const next =
            unvisited.splice(
                nearestIndex,
                1
            )[0];

        route.push(next);

        totalKm +=
            nearestDistance;

        current = next;

    }

    return {

        route,

        totalKm

    };

}


/* =========================================================
   MAP
========================================================= */

map = L.map("map").setView(
    [14.5869, 120.9812],
    14
);


L.tileLayer(
    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {

        maxZoom: 19,

        attribution:
            '&copy; OpenStreetMap contributors'

    }
).addTo(map);


/* =========================================================
   TOURIST MARKERS
========================================================= */

TOURIST_SPOTS.forEach(
    spot => {

        const icon =
            L.divIcon({

                html:
                    `<span class="marker-pin">
                        ${CATEGORY_ICONS[spot.cat] || "📍"}
                     </span>`,

                className:
                    "spot-icon",

                iconSize:
                    [30, 30],

                iconAnchor:
                    [15, 28]

            });


        const marker =
            L.marker(
                [
                    spot.lat,
                    spot.lng
                ],
                {
                    icon
                }
            )


            .addTo(map)


            .bindPopup(`

                <h3>
                    ${CATEGORY_ICONS[spot.cat]}
                    ${spot.name}
                </h3>

                <p>
                    ${spot.desc}
                </p>

                <p>
                    Category:
                    ${spot.cat}
                </p>

            `);


        spotMarkers[spot.id] =
            marker;

    }
);


/* =========================================================
   INITIAL LIST
========================================================= */

renderSpotList(
    TOURIST_SPOTS
);


/* =========================================================
   LOCATION
========================================================= */

document
    .getElementById("locateBtn")
    .addEventListener(
        "click",
        findUserLocation
    );


function findUserLocation() {

    if (!navigator.geolocation) {

        alert(
            "Geolocation is not supported by your browser."
        );

        return;

    }


    const button =
        document.getElementById(
            "locateBtn"
        );


    button.textContent =
        "⏳";


    navigator.geolocation.getCurrentPosition(

        function(position) {

            userPos = {

                lat:
                    position.coords.latitude,

                lng:
                    position.coords.longitude

            };


            if (userMarker) {

                map.removeLayer(
                    userMarker
                );

            }


            userMarker =
                L.marker(
                    [
                        userPos.lat,
                        userPos.lng
                    ],
                    {

                        icon:
                            L.divIcon({

                                html:
                                    '<span class="user-pin">📍</span>',

                                className:
                                    "spot-icon",

                                iconSize:
                                    [34, 34],

                                iconAnchor:
                                    [17, 32]

                            })

                    }
                )


                .addTo(map)


                .bindPopup(
                    "<b>You are here</b>"
                );


            userMarker.openPopup();


            map.setView(
                [
                    userPos.lat,
                    userPos.lng
                ],
                15
            );


            computeNearest();


            button.textContent =
                "📍";

        },

        function(error) {

            alert(
                "Could not get your location: "
                + error.message
            );

            button.textContent =
                "📍";

        },

        {

            enableHighAccuracy: true,

            timeout: 10000

        }

    );

}


/* =========================================================
   FIND NEAREST
========================================================= */

function computeNearest() {

    const ranked =
        TOURIST_SPOTS

            .map(
                spot => ({

                    ...spot,

                    distanceKm:
                        haversineKm(
                            userPos.lat,
                            userPos.lng,
                            spot.lat,
                            spot.lng
                        )

                })
            )

            .sort(
                (a, b) =>
                    a.distanceKm -
                    b.distanceKm
            );


    const nearest =
        ranked[0];


    document
        .getElementById(
            "nearestInfo"
        )
        .innerHTML = `

            <div class="nearest-name">

                ${CATEGORY_ICONS[nearest.cat]}

                ${nearest.name}

            </div>

            <div class="nearest-distance">

                ${nearest.distanceKm.toFixed(2)}
                km away

            </div>

            <div class="nearest-description">

                ${nearest.desc}

            </div>

        `;


    renderSpotList(ranked);


    document
        .getElementById(
            "routeBtn"
        )
        .disabled = false;

}


/* =========================================================
   ROUTE
========================================================= */

document
    .getElementById("routeBtn")
    .addEventListener(
        "click",
        calculateRoute
    );


function calculateRoute() {

    if (!userPos) {

        return;

    }


    const result =
        nearestNeighborRoute(
            userPos,
            TOURIST_SPOTS
        );


    const route =
        result.route;


    const totalKm =
        result.totalKm;


    const path = [

        [
            userPos.lat,
            userPos.lng
        ],

        ...route.map(
            spot => [
                spot.lat,
                spot.lng
            ]
        )

    ];


    if (routeLine) {

        map.removeLayer(
            routeLine
        );

    }


    routeLine =
        L.polyline(
            path,
            {

                color:
                    "#1a73e8",

                weight:
                    5,

                opacity:
                    0.85

            }
        )
        .addTo(map);


    map.fitBounds(
        routeLine.getBounds(),
        {

            padding:
                [50, 50]

        }
    );


    const routeInfo =
        document.getElementById(
            "routeInfo"
        );


    routeInfo.style.display =
        "block";


    routeInfo.innerHTML = `

        <h3>
            🗺️ Tour Route
        </h3>

        <ol>

            ${route.map(
                (spot, index) => {

                    const from =
                        index === 0
                            ? userPos
                            : route[index - 1];


                    const leg =
                        haversineKm(
                            from.lat,
                            from.lng,
                            spot.lat,
                            spot.lng
                        );


                    return `

                        <li>

                            <strong>
                                ${spot.name}
                            </strong>

                            <span
                                style="
                                    color:#777;
                                "
                            >

                                +${leg.toFixed(2)}
                                km

                            </span>

                        </li>

                    `;

                }
            ).join("")}

        </ol>

        <div class="route-total">

            Total distance:
            ${totalKm.toFixed(2)} km

        </div>

    `;

}


/* =========================================================
   SEARCH
========================================================= */

document
    .getElementById("searchBox")
    .addEventListener(
        "input",
        applyFilters
    );


document
    .getElementById("categoryFilter")
    .addEventListener(
        "change",
        applyFilters
    );


function applyFilters() {

    const query =
        document
            .getElementById(
                "searchBox"
            )
            .value
            .trim()
            .toLowerCase();


    const category =
        document
            .getElementById(
                "categoryFilter"
            )
            .value;


    const filtered =
        TOURIST_SPOTS.filter(
            spot =>

                (
                    category === "all"
                    ||
                    spot.cat === category
                )

                &&

                (
                    query === ""

                    ||

                    spot.name
                        .toLowerCase()
                        .includes(query)

                    ||

                    spot.desc
                        .toLowerCase()
                        .includes(query)
                )

        );


    TOURIST_SPOTS.forEach(
        spot => {

            const marker =
                spotMarkers[spot.id];


            const visible =
                filtered.some(
                    item =>
                        item.id === spot.id
                );


            if (
                visible &&
                !map.hasLayer(marker)
            ) {

                marker.addTo(map);

            }


            if (
                !visible &&
                map.hasLayer(marker)
            ) {

                map.removeLayer(marker);

            }

        }
    );


    const withDistance =
        filtered.map(
            spot => {

                if (!userPos) {

                    return spot;

                }


                return {

                    ...spot,

                    distanceKm:
                        haversineKm(
                            userPos.lat,
                            userPos.lng,
                            spot.lat,
                            spot.lng
                        )

                };

            }
        );


    if (userPos) {

        withDistance.sort(
            (a, b) =>
                a.distanceKm -
                b.distanceKm
        );

    }


    renderSpotList(
        withDistance
    );

}


/* =========================================================
   SPOT LIST
========================================================= */

function renderSpotList(
    spots
) {

    document
        .getElementById(
            "spotCount"
        )
        .textContent =
        `(${spots.length})`;


    const list =
        document.getElementById(
            "spotList"
        );


    list.innerHTML = "";


    spots.forEach(
        spot => {

            const item =
                document.createElement(
                    "li"
                );


            item.className =
                "spot-item";


            item.innerHTML = `

                <div>

                    <div class="spot-name">

                        ${CATEGORY_ICONS[spot.cat] || "📍"}

                        ${spot.name}

                    </div>

                    <div class="spot-category">

                        ${spot.cat}

                    </div>

                </div>


                <div class="spot-distance">

                    ${
                        spot.distanceKm
                            ? spot.distanceKm.toFixed(2)
                              + " km"
                            : ""
                    }

                </div>

            `;


            item.addEventListener(
                "click",
                function() {

                    map.setView(
                        [
                            spot.lat,
                            spot.lng
                        ],
                        16
                    );


                    spotMarkers[
                        spot.id
                    ].openPopup();

                }
            );


            list.appendChild(
                item
            );

        }
    );

}

</script>

</body>
</html>
